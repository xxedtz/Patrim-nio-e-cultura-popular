<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Patrimônio e Cultura Popular</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;700;800&family=Pacifico&family=Playfair+Display:wght@700;900&family=Rubik:wght@600;900&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#0a1028;color:#fff;font-family:Nunito,system-ui,sans-serif}
.s{position:fixed;inset:0;opacity:0;visibility:hidden;transform:translateX(7%) scale(.98);transition:opacity .7s,transform .7s cubic-bezier(.2,.7,.2,1),visibility 0s .7s;background:var(--bg)}
.s.on{opacity:1;visibility:visible;transform:none;transition:opacity .7s,transform .7s cubic-bezier(.2,.7,.2,1),visibility 0s}
.s.b{transform:translateX(-7%) scale(.98)}
.s::before,.s::after{content:"";position:absolute;pointer-events:none}
.s::before{inset:0}
.pat{--bg:linear-gradient(135deg,#0a1028,#1b2656 70%,#2a1f4d);--a:#e9c46a;--b:#f4a261;--f:'Playfair Display',Georgia,serif}
.pat::before{background:repeating-linear-gradient(90deg,rgba(233,196,106,.07) 0 3px,transparent 3px 90px),radial-gradient(circle at 100% 0,rgba(233,196,106,.25),transparent 45%)}
.pat::after{inset:22px;border:1px solid rgba(233,196,106,.4);border-radius:6px}
.ind{--bg:linear-gradient(150deg,#240d07,#5c2511 70%,#7a3414);--a:#f4a261;--b:#e63946;--f:'Alfa Slab One',Georgia,serif}
.ind::before{background:repeating-linear-gradient(45deg,rgba(244,162,97,.1) 0 2px,transparent 2px 28px),repeating-linear-gradient(-45deg,rgba(244,162,97,.1) 0 2px,transparent 2px 28px)}
.ind::after{left:0;right:0;bottom:0;height:26px;background:linear-gradient(135deg,var(--a) 25%,transparent 25%) -13px 0/26px 26px,linear-gradient(225deg,var(--a) 25%,transparent 25%) -13px 0/26px 26px,linear-gradient(315deg,var(--b) 25%,transparent 25%) 0 0/26px 26px,linear-gradient(45deg,var(--b) 25%,transparent 25%) 0 0/26px 26px}
.afr{--bg:linear-gradient(140deg,#1b0a2e,#3b0f45 65%,#12302a);--a:#ffb703;--b:#06d6a0;--f:Rubik,system-ui,sans-serif}
.afr::before{background:radial-gradient(circle,rgba(255,183,3,.16) 2px,transparent 3px) 0 0/34px 34px,radial-gradient(circle at 100% 100%,rgba(6,214,160,.22),transparent 40%)}
.afr::after{left:0;right:0;top:0;height:16px;background:repeating-linear-gradient(90deg,#ffb703 0 30px,#d00000 30px 60px,#06d6a0 60px 90px,#111 90px 100px)}
.fol{--bg:linear-gradient(180deg,#0b3a6b,#1d5aa0 70%,#2b7bbf);--a:#ffd23f;--b:#ff6b4a;--f:Pacifico,cursive}
.fol::before{background:radial-gradient(circle,rgba(255,255,255,.14) 2px,transparent 3px) 0 0/40px 40px}
.fl{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:0 6px}
.fl i{border:30px solid transparent;border-top:50px solid var(--f);border-bottom:0}
.o{position:absolute;right:-180px;top:-180px;width:640px;height:640px;border-radius:50%;border:2px solid var(--a);opacity:.25;box-shadow:0 0 0 40px rgba(255,255,255,.03),0 0 0 100px rgba(255,255,255,.02)}
.st{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;transform:scale(var(--k,1));padding:52px 90px 96px;display:flex;flex-direction:column;justify-content:flex-start;z-index:1}
.k{font:800 15px/1 Nunito;letter-spacing:.3em;text-transform:uppercase;color:var(--a);margin-bottom:14px}
h1,h2{font-family:var(--f);font-weight:900;line-height:1.08}
h1{font-size:84px;margin:10px 0 28px}
h2{font-size:46px;margin-bottom:14px}.ld{font-size:22px;line-height:1.4;opacity:.92;margin-bottom:20px;max-width:1090px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.c{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-top:5px solid var(--a);border-radius:20px;padding:22px 24px;backdrop-filter:blur(6px)}
.c b{display:block;font-size:26px;margin:10px 0 6px;color:var(--a)}
.c p{font-size:21px;line-height:1.38}
.e{font-size:44px}
.list,.il{display:grid;grid-auto-rows:1fr;gap:14px}.list .c,.il .c{display:flex;gap:22px;align-items:center;border-top:1px solid rgba(255,255,255,.18);border-left:6px solid var(--a);padding:12px 24px}
.list .c b,.il .c b{font-size:24px;margin:0 0 4px}.list .e,.il .e{font-size:38px;line-height:1}
.sp{display:grid;grid-template-columns:310px 1fr;gap:44px;align-items:start}.sp .ld{font-size:20px;margin:0}
.big{width:190px;aspect-ratio:1;margin-bottom:20px;border-radius:40% 60% 55% 45%/50% 40% 60% 50%;background:radial-gradient(circle at 30% 30%,var(--a),var(--b));display:grid;place-items:center;font-size:92px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.w{position:absolute;left:90px;bottom:42px;display:flex;gap:12px;align-items:center;font-weight:800;font-size:17px;background:rgba(0,0,0,.35);padding:7px 20px 7px 7px;border-radius:99px}
.w i{font-style:normal;width:36px;height:36px;border-radius:50%;background:var(--a);color:#111;display:grid;place-items:center;font-size:14px}
.w small{opacity:.7;font-weight:700}
.ctr{align-items:center;justify-content:center;text-align:center}
.pill{display:inline-block;margin:6px;padding:10px 22px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid var(--a);font-size:21px;font-weight:700}
.g{display:grid;gap:20px}
.t6{grid-template-columns:repeat(6,1fr)}.t6 .c{grid-column:span 2}.t6 .c:first-child{grid-column:span 6;display:flex;gap:24px;align-items:center}
.t4{grid-template-columns:repeat(4,1fr)}
.n1{font-family:var(--f);font-size:46px;color:var(--a);line-height:1}
.it{animation:up .7s both cubic-bezier(.2,.7,.2,1);animation-delay:calc(var(--i,0)*.11s + .25s)}
.s:not(.on) .it{animation:none}
@keyframes up{from{opacity:0;transform:translateY(26px)}}
.ui{position:fixed;z-index:9;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center}
.ui button{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.45);color:#fff;font-size:20px;cursor:pointer}
.ui button:hover,.ui button:focus-visible{background:#ffd23f;color:#000;outline:none}
.ui span{font-weight:800;font-size:15px;background:rgba(0,0,0,.45);padding:13px 16px;border-radius:99px}
#pg{position:fixed;left:0;bottom:0;height:5px;background:#ffd23f;z-index:9;transition:width .5s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style></head><body>
<div id="d"></div><div id="pg"></div>
<div class="ui"><button id="pv" aria-label="Slide anterior">◀</button><span id="nm" aria-live="polite"></span><button id="nx" aria-label="Próximo slide">▶</button><button id="fs" aria-label="Tela cheia" title="Tela cheia (F)">⛶</button></div>
<script>
const W=(n,p)=>`<div class="w it" style="--i:6"><i>${n.split(' ').map(x=>x[0]).join('').slice(0,2)}</i><div><small>Apresenta · parte ${p} de 2</small><br>${n}</div></div>`;
const C=[
["pat","sp","🏛️","Patrimônio · 1/6","O que é patrimônio cultural?","Patrimônio é tudo o que herdamos dos nossos antepassados, que faz parte da nossa vida hoje e que queremos deixar para as próximas gerações.","Iasmin Pereira",1,[["🧬","Herança viva","Não é só o que está guardado em museus. É o que o povo vive e ensina: um jeito de cozinhar, rezar, cantar, brincar e celebrar."],["🏰","Material e imaterial","O material são igrejas, casarões, objetos e paisagens. O imaterial são festas, danças, receitas, ofícios e saberes que passam de pessoa para pessoa."],["📜","Previsto em lei","A Constituição de 1988 reconhece a importância da cultura e determina que o Estado e a sociedade protejam o patrimônio cultural brasileiro."]]],
["pat","cards","🎭","Patrimônio · 2/6","Cultura popular: o saber do povo","A cultura popular é a criação coletiva de pessoas comuns: artesãos, cantadores, rezadeiras e brincantes que guardam a memória da comunidade.","Iasmin Pereira",2,[["🧑‍🤝‍🧑","Feita pelo povo","Nasce nas ruas, nos terreiros e nas casas, sem precisar de palco ou diploma. Cada comunidade cria e recria o seu jeito de festejar e de viver."],["🗣️","De geração em geração","Os avós ensinam aos netos pela fala, pelo exemplo e pela convivência. Assim cantigas, receitas e histórias atravessam décadas sem estarem escritas."],["🔄","Sempre em movimento","A tradição não está parada no tempo. Ela incorpora novos instrumentos, ritmos e participantes, mas mantém viva a identidade que une o grupo."]]],
["pat","list","🛡️","Patrimônio · 3/6","Quem protege esse patrimônio?","No Brasil, o cuidado com os bens culturais envolve o Estado, as comunidades e a escola, com instrumentos legais próprios para cada tipo de patrimônio.","José Edgar",1,[["🏢","Iphan","O Instituto do Patrimônio Histórico e Artístico Nacional foi criado em 1937. Ele estuda, identifica, protege e promove os bens culturais de todo o país."],["🔒","Tombamento","Protege os bens materiais, como igrejas, casarões, centros históricos e paisagens. Um bem tombado não pode ser destruído nem descaracterizado."],["📖","Registro","Reconhece os bens imateriais, como festas, saberes, ofícios e formas de expressão. Valoriza a prática e ajuda a comunidade a manter a tradição viva."]]],
["pat","cards","🏆","Patrimônio · 4/6","Exemplos reconhecidos","Muitas manifestações populares brasileiras já foram reconhecidas oficialmente, no país e no mundo, pela importância que têm para a nossa identidade.","José Edgar",2,[["🩰","Frevo","Ritmo e dança nascidos no carnaval do Recife, com passos acrobáticos e sombrinhas coloridas. Foi reconhecido como Patrimônio Imaterial da Humanidade pela Unesco em 2012."],["🤸","Roda de Capoeira","Mistura luta, dança, música e jogo, e nasceu da resistência de africanos escravizados. A roda e o ofício dos mestres foram reconhecidos pela Unesco em 2014."],["⛪","Círio de Nazaré","Grande procissão em Belém do Pará, que reúne uma multidão de devotos todo mês de outubro. É uma das maiores festas religiosas do país e é registrada pelo Iphan."]]],
["pat","sp","📍","Patrimônio · 5/6","Patrimônio em Alagoas","Alagoas guarda uma história rica em resistência, fé e festa, e muita dela segue viva em lugares e tradições que podemos conhecer de perto.","Samyly Vitória",1,[["⛰️","Serra da Barriga","Em União dos Palmares, abrigou o Quilombo dos Palmares, o maior símbolo de resistência negra do período colonial e território de Zumbi."],["🏘️","Penedo","Cidade às margens do rio São Francisco, com casarões, igrejas e ruas do período colonial. Seu conjunto histórico é tombado pelo Iphan."],["🥁","Folguedos","Guerreiro, pastoril, coco de roda, baianas e taieira misturam dança, música e teatro popular, e animam festas por todo o estado."]]],
["pat","list","🌱","Patrimônio · 6/6","Por que preservar?","Preservar o patrimônio não é olhar só para o passado. É garantir que as próximas gerações tenham raízes, referências e orgulho de quem são.","Samyly Vitória",2,[["🪪","Identidade","Conhecer as nossas origens ajuda a entender quem somos. O patrimônio dá sentido de pertencimento e fortalece a autoestima das pessoas e das comunidades."],["🌈","Diversidade","O Brasil é feito de muitos povos, crenças e jeitos de viver. Proteger cada cultura é reconhecer que nenhuma vale mais que a outra e combater o preconceito."],["🎓","Transmissão","A escola, a família e as comunidades têm papel essencial em ensinar e praticar as tradições. Quando ninguém ensina, o saber desaparece com o tempo."]]],
["ind","sp","🏹","Matrizes indígenas · 1/2","Os primeiros povos do Brasil","Muito antes de 1500, o território brasileiro já era habitado por centenas de povos, cada um com sua língua, suas crenças e sua forma de cuidar da terra.","Neivyton",1,[["🗺️","Diversidade","Hoje existem mais de 300 povos indígenas no país, que falam cerca de 270 línguas. Cada povo tem sua história, seus costumes e sua organização própria."],["🍠","No dia a dia","Herdamos a mandioca, o milho, a tapioca, a rede de dormir e centenas de palavras de origem indígena, como abacaxi, jabuti e tatu."],["🌿","Saberes da natureza","Os povos indígenas conhecem plantas medicinais, o ciclo das águas e o manejo da floresta. Esse conhecimento ajuda a preservar o meio ambiente até hoje."]]],
["ind","cards","🪶","Matrizes indígenas · 2/2","Arte, ritual e resistência","A cultura indígena se expressa no corpo, na música e nos objetos do cotidiano, e segue sendo defendida por quem luta pelo direito de existir com identidade.","Neivyton",2,[["🎨","Arte e grafismo","A pintura corporal, feita com urucum e jenipapo, mostra a que povo a pessoa pertence e o momento da vida em que está. Cestas e cerâmicas também levam grafismos."],["🔥","Toré","Dança e canto sagrados de povos do Nordeste, feitos em roda, ao som de maracás. Em Alagoas é mantido, por exemplo, pelos Xukuru-Kariri e pelos Kariri-Xocó."],["✊","Resistência","Os povos indígenas lutam pela demarcação das terras, pelo ensino das línguas nativas e pelo respeito aos direitos garantidos pela Constituição de 1988."]]],
["afr","list","🥁","Matrizes africanas · 1/2","Raízes que cruzaram o Atlântico","Entre os séculos XVI e XIX, milhões de africanos foram trazidos à força ao Brasil. Com eles vieram línguas, músicas, crenças e saberes que ajudaram a formar o país.","Amanda Farias",1,[["⛓️","Travessia forçada","Povos de diversas regiões da África, como bantos, iorubás e jejes, foram escravizados. Mesmo sob violência, resistiram e preservaram a sua cultura."],["🎶","Ritmo e movimento","A herança africana está no samba, na capoeira, no maracatu, no jongo e na congada: expressões que unem música, dança e celebração da comunidade."],["🕯️","Fé e ancestralidade","O candomblé e outras religiões de matriz africana cultuam ancestrais e forças da natureza, e preservam cantos, danças e o cuidado com a comunidade."]]],
["afr","cards","🍲","Matrizes africanas · 2/2","Presença no nosso cotidiano","A cultura africana está tão presente na vida brasileira que muitas vezes nem percebemos: ela aparece no prato, na fala, na música e na luta por liberdade.","Amanda Farias",2,[["🥘","Sabores","Acarajé, vatapá, caruru e o azeite de dendê vieram da culinária africana, transformada nas cozinhas brasileiras. O quiabo também faz parte dessa herança."],["💬","Palavras","O português do Brasil tem muitas palavras de origem africana, como caçula, moleque, quitanda, fubá e samba, que usamos todos os dias sem pensar na origem."],["🏞️","Quilombos","Eram comunidades de pessoas que fugiam da escravidão e criavam espaços de liberdade. O maior foi Palmares, no atual estado de Alagoas, liderado por Zumbi."]]],
["fol","cards","🌳","Matrizes folclóricas · 1/4","Lendas e personagens","O folclore brasileiro nasceu da mistura de histórias indígenas, africanas e europeias. As lendas explicam a natureza, ensinam valores e são contadas até hoje.","Myrian Mercelaine",1,[["🦶","Curupira","Protetor das florestas, tem cabelos de fogo e os pés virados para trás, o que confunde quem tenta segui-lo. Castiga quem caça ou derruba as matas sem necessidade."],["🌀","Saci-Pererê","Menino de uma perna só, com gorro vermelho e cachimbo, que vive aprontando travessuras. Surge em redemoinhos de vento e esconde objetos nas casas."],["🧜‍♀️","Iara","Também chamada de Mãe-d'água, é uma bela mulher dos rios que encanta os pescadores com seu canto. Representa o respeito que as águas merecem."]]],
["fol","sp","🎲","Matrizes folclóricas · 2/4","Cantigas, parlendas e brincadeiras","Boa parte do folclore é brincadeira, transmitida pela fala e pela prática. Crianças e adultos aprendem, repetem e inventam, e assim a tradição segue viva.","Myrian Mercelaine",2,[["🎵","Cantigas de roda","Músicas cantadas em roda, com gestos e passos, como Ciranda, Cirandinha e A Canoa Virou. Têm versos simples e fáceis de memorizar."],["🗨️","Parlendas e trava-línguas","Rimas faladas que treinam a memória e a dicção. Muitas servem até para escolher quem começa a brincadeira ou para dar ritmo ao jogo."],["🪀","Brincadeiras","Amarelinha, pular corda, pião e pipa são jogos antigos que ensinam regras, trabalho em grupo e criatividade, sem precisar de tecnologia."]]],
["fol","list","🎆","Matrizes folclóricas · 3/4","Festas populares","As festas populares unem religião, música, comida e dança. Elas reúnem a comunidade e mostram como cada região do Brasil celebra a vida.","Gustavo Alves",1,[["🔥","Festas juninas","Em junho, o Nordeste celebra Santo Antônio, São João e São Pedro com fogueira, quadrilha, forró, milho e canjica. É uma das maiores festas do povo nordestino."],["🎭","Carnaval","Mistura de influências africanas, indígenas e europeias, com ritmos diferentes em cada lugar: frevo e maracatu em Pernambuco, samba no Rio de Janeiro, entre outros."],["⭐","Reisado","Cortejo de músicos, dançarinos e personagens que cantam de casa em casa no período do Natal, até 6 de janeiro, Dia de Reis, em homenagem aos Santos Reis."]]],
["fol","sp","💃","Matrizes folclóricas · 4/4","Danças e folguedos","Folguedos são manifestações que juntam dança, música, teatro e figurinos. Contam histórias do povo e costumam ser apresentados em grupo, em festas e cortejos.","Gustavo Alves",2,[["🐂","Bumba meu boi","Conta a história de um boi que morre e ressuscita, com personagens, cantos e danças. É muito forte no Maranhão, mas existe em todo o Brasil com nomes diferentes."],["🌙","Coco e Guerreiro","O coco é uma dança de roda com percussão. O Guerreiro é um folguedo alagoano com cantos, personagens como o Mateus e chapéus enfeitados com espelhos e fitas."],["🎪","Pastoril","Folguedo de Natal em que pastoras, divididas em cordões azul e encarnado, cantam e dançam em homenagem ao nascimento de Jesus."]]]];
const card=(x,i)=>`<div class="c it" style="--i:${i+2}"><span class="e">${x[0]}</span><div><b>${x[1]}</b><p>${x[2]}</p></div></div>`;
const H=[["pat",`<i class="o"></i><div class="st ctr"><div class="k it">Escola Estadual Olímpia Tenório Lima · Artes</div><h1 class="it" style="--i:1">Patrimônio<br>e Cultura Popular</h1><div class="it" style="--i:3"><span class="pill">🏹 Matrizes indígenas</span><span class="pill">🥁 Matrizes africanas</span><span class="pill">🎭 Matrizes folclóricas brasileiras</span></div><p class="it" style="--i:5;margin-top:34px;font-size:20px;opacity:.85">Professor Jean · Artes</p></div>`],
["pat",`<i class="o"></i><div class="st"><div class="k it">Roteiro</div><h2 class="it" style="--i:1">Sumário</h2><div class="g t6">${[["01","Patrimônio e cultura popular","Slides 4 a 9 · tema principal","🏛️","#e9c46a"],["02","Matrizes indígenas","Slides 10 e 11","🏹","#f4a261"],["03","Matrizes africanas","Slides 12 e 13","🥁","#ffb703"],["04","Matrizes folclóricas","Slides 14 a 17","🎭","#ffd23f"]].map((x,i)=>`<div class="c it" style="--i:${i+2};--a:${x[4]}"><span class="n1">${x[0]}</span><div><b>${x[3]} ${x[1]}</b><p>${x[2]}</p></div></div>`).join('')}</div></div>`],
["pat",`<i class="o"></i><div class="st"><div class="k it">Equipe</div><h2 class="it" style="--i:1">Integrantes e sorteio</h2><div class="g t4">${[["Iasmin Pereira","4 e 5","🏛️"],["José Edgar","6 e 7","🏛️"],["Samyly Vitória","8 e 9","🏛️"],["Neivyton","10 e 11","🏹"],["Amanda Farias","12 e 13","🥁"],["Myrian Mercelaine","14 e 15","🎭"],["Gustavo Alves","16 e 17","🎭"],["Prof. Jean","Artes","🎨"]].map((x,i)=>`<div class="c it" style="--i:${i+2}"><span class="e">${x[2]}</span><b style="font-size:22px">${x[0]}</b><p style="font-size:18px">${i<7?'Slides ':''}${x[1]}</p></div>`).join('')}</div></div>`]];
C.forEach(([t,l,ic,k,ti,ld,who,p,it])=>H.push([t,`<i class="o"></i><div class="st"><div class="k it">${k}</div><h2 class="it" style="--i:1">${ti}</h2>`+(l=='sp'?`<div class="sp"><div><div class="big it" style="--i:2">${ic}</div><p class="ld it" style="--i:3">${ld}</p></div><div class="il">${it.map(card).join('')}</div></div>`:`<p class="ld it" style="--i:2">${ld}</p><div class="${l}">${it.map(card).join('')}</div>`)+W(who,p)+`</div>`]));
H.push(["pat",`<i class="o"></i><div class="st ctr"><div class="k it">Fim da apresentação</div><h1 class="it" style="--i:1">Obrigado!</h1><p class="it" style="--i:2;font-size:26px;max-width:800px;line-height:1.4">Agradecemos ao professor Jean e a todos que acompanharam esta viagem pela nossa cultura.</p><div class="it" style="--i:4;margin-top:28px"><span class="pill">Iasmin</span><span class="pill">José Edgar</span><span class="pill">Samyly</span><span class="pill">Neivyton</span><span class="pill">Amanda</span><span class="pill">Myrian</span><span class="pill">Gustavo</span></div></div>`]);
const R=document.getElementById('d'),cl=['#ffd23f','#ff6b4a','#fff','#4cc9f0'];
const S=H.map(([t,h])=>{const s=document.createElement('section');s.className='s '+t;s.setAttribute('aria-roledescription','slide');s.innerHTML=h;
if(t=='fol')s.insertAdjacentHTML('afterbegin','<div class="fl">'+cl.concat(cl,cl,cl,cl).slice(0,18).map(c=>`<i style="--f:${c}"></i>`).join('')+'</div>');R.append(s);return s});
let n=0;const go=i=>{n=Math.max(0,Math.min(S.length-1,i));S.forEach((s,j)=>{s.classList.toggle('on',j==n);s.classList.toggle('b',j<n)});pg.style.width=(n+1)/S.length*100+'%';nm.textContent=(n+1)+' / '+S.length};
const fit=()=>document.documentElement.style.setProperty('--k',Math.min(innerWidth/1280,innerHeight/720));
const fs=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
pv.onclick=()=>go(n-1);nx.onclick=()=>go(n+1);document.getElementById('fs').onclick=fs;
addEventListener('keydown',e=>{const k=e.key;if(['ArrowRight',' ','PageDown','Enter'].includes(k))go(n+1);else if(['ArrowLeft','PageUp'].includes(k))go(n-1);else if(k=='Home')go(0);else if(k=='End')go(S.length-1);else if(k=='f'||k=='F')fs()});
let x0;addEventListener('touchstart',e=>x0=e.touches[0].clientX);addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)go(n+(d<0?1:-1))});
addEventListener('resize',fit);fit();go(0);
